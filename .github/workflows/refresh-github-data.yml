name: refresh-github-snapshot

on:
  schedule:
    # Every Monday 06:00 UTC — keeps the portfolio evidence fresh.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-github-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh GitHub snapshot
        # GITHUB_TOKEN is authenticated (5,000 req/hr), so the refresh never
        # starves the way anonymous runs (60 req/hr) can.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-github-data.mjs

      - name: Commit snapshot if evidence changed
        # refreshedAt always moves, so compare canonical content excluding
        # the timestamp — skip the weekly commit when nothing real changed.
        run: |
          strip_ts() { python3 -c "import json,sys; d=json.load(open('src/data/generated/github-snapshot.json')); d.pop('refreshedAt',None); print(json.dumps(d,sort_keys=True))"; }
          strip_ts > /tmp/snapshot.new.json
          git show HEAD:src/data/generated/github-snapshot.json > /tmp/snapshot.head.json 2>/dev/null || echo '{}' > /tmp/snapshot.head.json
          python3 -c "import json; d=json.load(open('/tmp/snapshot.head.json')); d.pop('refreshedAt',None); print(json.dumps(d,sort_keys=True))" > /tmp/snapshot.old.json
          if cmp -s /tmp/snapshot.new.json /tmp/snapshot.old.json; then
            echo "Evidence unchanged (only timestamp moved) — nothing to commit."
            exit 0
          fi
          # Evidence changed: keep the sitemap freshness signal truthful too.
          TODAY=$(date -u +%F)
          sed -i "s|<lastmod>[0-9-]*</lastmod>|<lastmod>${TODAY}</lastmod>|g" public/sitemap.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/github-snapshot.json public/sitemap.xml
          git commit -m "chore: refresh GitHub snapshot ${TODAY}"
          git push
